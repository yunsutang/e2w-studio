<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Thrad event photos</title>
  <style>
    :root { color-scheme: light; --ink: #17140f; --muted: #6f675d; --line: #e6e0d8; --accent: #e7a33e; --paper: #fbfaf8; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 64px 0 72px; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 38px; border-bottom: 1px solid var(--line); padding-bottom: 28px; }
    .eyebrow { margin: 0 0 12px; color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(38px, 6vw, 72px); font-weight: 400; letter-spacing: -.045em; line-height: .95; }
    .intro { max-width: 350px; margin: 0; color: var(--muted); font-size: 15px; line-height: 1.55; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
    figure { margin: 0; }
    .photo { display: block; overflow: hidden; background: #eee9e2; aspect-ratio: 4 / 3; }
    .photo img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .35s ease; }
    figure:hover img { transform: scale(1.025); }
    figcaption { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 0 0; }
    .name { color: var(--muted); font-size: 13px; }
    a.download { flex: none; color: var(--ink); font-size: 12px; font-weight: 700; text-decoration: none; border-bottom: 1px solid var(--accent); padding-bottom: 2px; }
    a.download:hover { color: #9b641f; }
    footer { margin-top: 42px; color: var(--muted); font-size: 12px; }
    @media (max-width: 760px) { main { width: min(100% - 28px, 560px); padding-top: 36px; } header { display: block; } .intro { margin-top: 20px; max-width: 500px; } .grid { grid-template-columns: 1fr; gap: 30px; } }
  </style>
</head>
